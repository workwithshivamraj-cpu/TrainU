name: Quality and security
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements.txt ruff pip-audit
      - name: Python correctness lint
        run: ruff check backend --select E9,F821,F822,F823
      - name: Validate immutable AI model lock
        run: python scripts/validate-model-lock.py
      - name: Destructive-test safety unit tests
        run: PYTHONPATH=backend pytest -q backend/tests_environment
      - name: Python dependency security gate
        run: pip-audit -r backend/requirements.txt
      - run: npm ci
        working-directory: frontend
      - name: Browser dependency security gate
        run: npm audit --omit=dev --audit-level=high
        working-directory: frontend
      - name: Browser extension tests
        run: node --test extension/tests/*.test.js
      - name: Production build including in-app documentation
        run: npm run build -- --configuration production
        working-directory: frontend
      - name: Verify public documentation allowlist
        run: |
          test -f frontend/public/docs/product.md
          test -f frontend/public/docs/demo-videos.md
          ! find frontend/public/docs -maxdepth 1 -type f -name '*.md' ! -name product.md ! -name demo-videos.md | grep .
      - name: Shell syntax and tracked-secret guard
        run: |
          bash -n backend/docker-entrypoint.sh scripts/*.sh
          if git ls-files | grep -E '(^|/)\.env($|\.(production|local)$)'; then
            echo 'Runtime secrets must not be committed.' >&2
            exit 1
          fi

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start disposable stack and run migrations
        run: |
          cp .env.example .env
          docker compose build backend frontend
          docker compose up -d postgres redis minio
          bash scripts/backup-local-data.sh
          TRAINU_MIGRATION_BACKUP_CONFIRMED=verified-local-backup docker compose --profile local-tools up -d
          bash scripts/wait-ready.sh http://localhost:8000/health/ready 120
          bash scripts/wait-ready.sh http://localhost:4200/health 30
      - name: Backend tenant isolation, RBAC, auth and pipeline tests
        run: >-
          docker compose exec -T
          -e ENVIRONMENT=test
          -e TRAINU_ALLOW_SCHEMA_RESET=true
          -e TRAINU_TEST_DATABASE_URL=postgresql+psycopg2://trainu:trainu@postgres:5432/trainu_test
          -e TRAINU_TEST_STORAGE_BUCKET=trainu-media-test
          -e TRAINU_TEST_S3_ENDPOINT_URL=http://minio:9000
          -e TRAINU_TEST_REDIS_URL=redis://redis:6379/1
          -e RATE_LIMIT_BACKEND=memory
          backend pytest -q
      - name: Seed disposable demo and verify runtime
        run: |
          docker compose exec -T backend python -m scripts.seed
          bash scripts/smoke.sh http://localhost:4200
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser acceptance tests
        run: npm run e2e
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:4200
      - name: Failure evidence
        if: failure()
        run: docker compose logs --no-color --tail=100
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-failure-evidence
          path: frontend/test-results
          retention-days: 7
      - name: Cleanup disposable volumes
        if: always()
        run: |
          docker compose down -v
          rm -rf .local-backups
