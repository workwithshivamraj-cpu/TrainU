add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy strict-origin-when-cross-origin always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
# Angular component styles need inline styles. Production scripts stay same-origin.
# Narrow media/image hosts to your storage endpoint at deployment if practical.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: https:; connect-src 'self' https:; media-src 'self' blob: http://localhost:9000 https:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
