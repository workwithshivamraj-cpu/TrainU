server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    include /etc/nginx/security-headers.conf;

    # Match API upload limits, including multipart overhead. Avoid placing large
    # upload bodies on container disk; the API enforces per-type size limits.
    client_max_body_size 1030m;
    client_body_timeout 120s;

    location = /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location ^~ /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
        proxy_buffering off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }

    # Angular production filenames are content-hashed: these are CDN-safe.
    location ~* "^/(?:.+/)?[^/]+-[a-z0-9]{8,}\\.(?:css|js)$" {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security-headers.conf;
    }

    location /docs/ {
        try_files $uri =404;
        default_type text/plain;
        add_header Cache-Control "public, max-age=300" always;
        include /etc/nginx/security-headers.conf;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=3600" always;
        include /etc/nginx/security-headers.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store" always;
        include /etc/nginx/security-headers.conf;
    }
}
