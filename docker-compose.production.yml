# Standalone production profile. Requires existing managed PostgreSQL, Redis,
# private S3 storage, TLS ingress and a protected runtime env file.
# This profile does not create cloud resources or provide host-level HA.
name: trainu-production

x-runtime: &runtime
  image: ${TRAINU_API_IMAGE:?Set TRAINU_API_IMAGE to a tested immutable image}
  env_file: ${TRAINU_ENV_FILE:-.env.production}
  environment:
    ENVIRONMENT: production
    DEBUG: "false"
    DEMO_MODE: "false"
    RATE_LIMIT_BACKEND: redis
    TRAINU_MIGRATION_BACKUP_CONFIRMED: ${TRAINU_MIGRATION_BACKUP_CONFIRMED:-}
    # Safe only because API has no host port and the internal gateway is trusted.
    FORWARDED_ALLOW_IPS: "*"
  user: "10001:10001"
  read_only: true
  tmpfs: ["/tmp:size=2147483648,mode=1777"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  init: true
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}
  volumes:
    - trainu_model_cache:/var/cache/trainu/huggingface

services:
  migrate:
    <<: *runtime
    command: ["migrate"]
    restart: "no"
    healthcheck: {disable: true}
    mem_limit: 512m
    cpus: 0.5

  backend:
    <<: *runtime
    command: ["api"]
    restart: unless-stopped
    stop_grace_period: 30s
    expose: ["8000"]
    mem_limit: 1g
    cpus: 1
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}

  worker:
    <<: *runtime
    command: ["worker"]
    restart: unless-stopped
    stop_grace_period: 5m
    mem_limit: 4g
    cpus: 2
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.celery_app inspect ping -d celery@$$HOSTNAME --timeout=5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      start_period: 30s
      retries: 3
    depends_on:
      migrate: {condition: service_completed_successfully}

  frontend:
    image: ${TRAINU_FRONTEND_IMAGE:?Set TRAINU_FRONTEND_IMAGE to a tested immutable image}
    restart: unless-stopped
    user: "101:101"
    read_only: true
    tmpfs: ["/tmp:size=67108864,mode=1777"]
    ports: ["127.0.0.1:${FRONTEND_PORT:-8080}:8080"]
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    mem_limit: 128m
    cpus: 0.5
    depends_on:
      backend: {condition: service_healthy}

volumes:
  trainu_model_cache:
